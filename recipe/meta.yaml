{% set name = "libertem-holo" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/libertem_holo-{{ version }}.tar.gz
  sha256: b0729f047106bfc47d03c562a04aacf9b252d3e819fd863133e31abe94507d0b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-fancy-pypi-readme
    - pip
  run:
    - python >={{ python_min }}
    - libertem
    - numpy
    - numba >=0.53  # [py<310]
    - numba >=0.55  # [py==310]
    - numba >=0.57  # [py==311]
    - numba >=0.59  # [py==312]
    - numba >=0.63  # [py==313]
    - numba >=0.63  # [py>=314]
    - ncempy
    - scipy
    - sparse
    - sparseconverter
    - scikit-image
    - natsort
    - empyre

test:
  imports:
    - libertem_holo
  commands:
    - pip check
    - pytest tests
  source_files:
    - tests
    - conftest.py
    - pytest.ini
  requires:
    - python {{ python_min }}
    - pip
    - pytest >=6
    - pytest-cov
    - pytest-benchmark

about:
  home: https://libertem.github.io/LiberTEM-holo/
  summary: Electron holography reconstruction using LiberTEM
  license: GPL-3.0-only
  license_file: LICENSE
  description: |
    LiberTEM-holo is a Python library for off-axis electron holography
    reconstruction, especially for reconstructing and aligning large stacks
    of holograms efficiently.
    It is built on LiberTEM for I/O and for parallelization.

extra:
  recipe-maintainers:
    - sk1p
    - uellue
    - matbryan52
    - malika576
